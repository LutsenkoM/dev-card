# Extra wp-config.php code, shared by the web server and WP-CLI (YAML anchor).
# Local SMTP points to Mailpit; on a real server these constants go into wp-config.php.
x-wp-config-extra: &wp-config-extra |
  define('WP_DEBUG_LOG', true);
  define('WP_DEBUG_DISPLAY', false);
  define('WP_ENVIRONMENT_TYPE', 'local');
  define('SCRIPT_DEBUG', true);
  define('DEV_CARD_SMTP_HOST', 'mailpit');
  define('DEV_CARD_SMTP_PORT', 1025);
  define('DEV_CARD_SMTP_SECURE', '');
  define('DEV_CARD_SMTP_FROM', 'noreply@dev-card.local');

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    volumes:
      - ./wordpress:/var/www/html

  phpmyadmin:
    image: phpmyadmin
    depends_on: [db]
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

  # Catches all outgoing email locally. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  wpcli:
    image: wordpress:cli
    user: "33:33"
    depends_on: [db, wordpress]
    volumes:
      - ./wordpress:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    profiles: ["cli"]

volumes:
  db_data:
